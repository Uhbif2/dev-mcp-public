[project]
name = 'dev-mcp'
version = '0.1.0'
description = 'Узкий MCP-сервер для работы с кодом внутри разрешённых корней'
requires-python = '>=3.11'
dependencies = [
    'fastmcp>=2.0',
    'psutil>=5.9',
]

[project.optional-dependencies]
dev = ['pytest>=8.0', 'pytest-asyncio>=1.0']

[project.scripts]
dev-mcp = 'dev_mcp.__main__:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/dev_mcp']

[tool.pytest.ini_options]
testpaths = ['tests']
