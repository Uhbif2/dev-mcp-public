name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, fleet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]" ruff
      - name: Lint correctness
        run: ruff check --select E9,F63,F7,F82 src guard
      - name: Core and owner tests
        if: matrix.suite == 'core'
        run: python -m pytest tests --ignore=tests/fleet -m "not production" -q --junitxml=results.xml
      - name: Fleet tests
        if: matrix.suite == 'fleet'
        run: python -m pytest tests/fleet -m "not production" -q --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.suite }}
          path: results.xml
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run test:all
        working-directory: extension/fleet-tabs
